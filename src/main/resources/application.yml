server:
  port: 8080

spring:
  config:
    import:
      - classpath:simulation.yml
      - classpath:temp.yml
      - classpath:warehouse.yml
      - classpath:camera.yml
      - optional:classpath:application-private.yml
      # 仅作为字段参考，不参与运行；需要核对字段时可临时取消下一行注释。
      # - optional:classpath:application-position.sample.yml
  application:
    name: jushen-digital-twin-backend

dashboard:
  websocket:
    token: jushen-screen-token
    allowed-origin-patterns:
      - "*"
    external-order:
      enabled: true
        # 这里之后填对方真实 POST 地址
      post-url: ""

      # true：如果目的地没有 coords，不进入 town_road_render
      require-renderable-coords: true

      connect-timeout-ms: 5000
      request-timeout-ms: 12000

      # true 表示对方每次返回全量快照
      # 本次没出现但本地存在的 lineId，会被认为已删除
      full-snapshot: true

      # 是否同步后主动通过 WebSocket 推给前端
      broadcast-diff: true

      # 定时同步开关。先建议 false，手动调接口测试稳定后再开
      scheduled-sync-enabled: false
      sync-rate-ms: 10000

      connect-timeout-ms: 5000
      request-timeout-ms: 12000
  route:
    simulation-profile: test
    passive-position-push-enabled: false
    group-size: 12
    truck-position-push-rate-ms: 60000
    low-speed-threshold-kmh: 50
    default-group-strategy: business-priority

    # 以下为外部车辆位置模块的公开默认值；真实地址、账号、测试车辆请放到 application-private.yml。
    auth-enabled: false
    auth-url: ""
    auth-id: ""
    auth-secret: ""
    external-position-url: ""
    external-position-token: ""
    external-position-batch-size: 50
    test-plate: ""
    test-car-id: ""
    test-on-startup: false
    token-cache-enabled: true
    token-cache-path: target/local-cache/token-cache.json

    test:
      simulation-speed-kmh: 15000
      position-query-interval-ms: 60000
      slow-position-query-interval-ms: 15000
    real:
      simulation-speed-kmh: 80
      position-query-interval-ms: 1800000
      slow-position-query-interval-ms: 300000
