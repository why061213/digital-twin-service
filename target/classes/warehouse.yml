warehouses:
  warehouses:
    - city: 佛山市
      label: 佛山一号仓
    - city: 北京市
      label: 北京中心仓
    - city: 上海市
      label: 上海浦东仓
    - city: 广州市
      label: 广州南沙仓
    - city: 成都市
      label: 成都高新仓
    - city: 武汉市
      label: 武汉光谷仓

  focus-panels:
    count: 3
    style:
      width: 260
      max-height: 420
      placement: right
      theme: cyan-dark
    panels:
      - id: inventory-table
        title: 实时库存明细
        chart-type: table
        height: 112
        required-columns: [metric, value, unit]
        columns:
          - key: metric
            label: 指标
          - key: value
            label: 数值
          - key: unit
            label: 单位
      - id: throughput-bar
        title: 今日吞吐量
        chart-type: bar
        height: 132
        required-columns: [name, value]
        columns:
          - key: name
            label: 时段
          - key: value
            label: 吨
      - id: category-ring
        title: 品类占比
        chart-type: ring
        height: 132
        required-columns: [name, value]
        columns:
          - key: name
            label: 品类
          - key: value
            label: 吨
