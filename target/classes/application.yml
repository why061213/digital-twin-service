server:
  port: 8080

spring:
  config:
    import:
      - classpath:simulation.yml
      - classpath:temp.yml
      - classpath:warehouse.yml
      - classpath:camera.yml
      - optional:classpath:application-private.yml
      # 仅作为字段参考，不参与运行；需要核对字段时可临时取消下一行注释。
      # - optional:classpath:application-position.sample.yml
  application:
    name: jushen-digital-twin-backend

dashboard:
  websocket:
    token: jushen-screen-token
    allowed-origin-patterns:
      - "*"
    external-order:
      # 外部订单 GET 地址；为空时使用 TownRoadExternalOrderClient 内置正式地址。
      post-url: ""

      # true：如果目的地没有 coords，不进入 town_road_render
      require-renderable-coords: true

      connect-timeout-ms: 5000
      request-timeout-ms: 12000
      max-candidate-province-count: 4
      max-candidate-path-count: 4
      candidate-tolerance-ratio: 0.30
      candidate-absolute-slack: 250

      # RM2 正式订单链路：应用就绪后主动拉取一次，之后持续更新快照。
      auto-sync-enabled: true
      auto-sync-initial-delay-ms: 5000
      auto-sync-fixed-delay-ms: 900000
      # true 时，仅展示能解析 supplier vehicleId、可进行真实位置批量校准的订单。
      ignore-orders-without-real-position: false
  route:
    # 正式展示使用真实时间尺度的模拟；test 档 36000km/h 仅用于快速演示。
    simulation-profile: real
    passive-position-push-enabled: true
    group-size: 12
    default-group-strategy: province-path

    # 位置批量刷新配置（替代逐车穿透外部接口）
    position-refresh:
      enabled: true
      # 首次订单快照完成后再开始批量校准，避免启动时空跑一次。
      initial-delay-ms: 10000
      fixed-delay-ms: 30000
      batch-size: 50
      request-timeout-ms: 10000
      stale-after-ms: 180000

    # 以下为外部车辆位置模块的公开默认值；真实地址、账号、测试车辆请放到 application-private.yml。
    auth-enabled: false
    auth-url: ""
    auth-id: ""
    auth-secret: ""
    external-position-url: ""
    external-position-token: ""
    external-position-batch-size: 50
    # 车辆字典 vehicle_name -> vehicle_id。0 表示进程启动后仅加载一次；正数才定时刷新。
    vehicle-dictionary-refresh-ms: 0
    test-plate: ""
    test-car-id: ""
    test-on-startup: false
    token-cache-enabled: true
    token-cache-path: target/local-cache/token-cache.json

    test:
      simulation-speed-kmh: 15000
    real:
      simulation-speed-kmh: 80

  # ===== 本地坐标库 + 高德地图地理编码 =====
  coord-db:
    # 高德地图 Web API Key（用于地理编码）
    # 申请地址：https://console.amap.com/dev/key/app
    # 真实值请在 application-private.yml 中配置
    amap-key: ""
    # 高德地图安全密钥（用于请求 SHA256 签名）
    amap-secret: ""
    # API 调用间隔（毫秒），避免 QPS 超限。3次/秒 ≈ 334ms
    amap-rate-limit-ms: 334
    # 本地库 classpath 路径
    local-path: coord-db
    # API 请求超时（毫秒）
    request-timeout-ms: 12000
